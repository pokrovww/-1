<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить товар</title>
</head>
<body>
<h1>Добавить товар</h1>
<form th:action="@{/products/add}" th:object="${product}" method="post">
    <p>Название: <input type="text" th:field="*{name}"></p>
    <p>Цена: <input type="number" step="0.01" th:field="*{price}"></p>
    <p>Описание: <input type="text" th:field="*{description}"></p>
    <button type="submit">Сохранить</button>
</form>
</body>
</html>
